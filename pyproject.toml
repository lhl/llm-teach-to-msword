[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legaldoc"
version = "0.1.0"
description = "Reliable MS Word output for legal documents, with layout in data rather than in a prompt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The legaldoc Authors" }]
keywords = ["docx", "legal", "ooxml", "dspy", "typography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Only needed for the extraction step and the GEPA runs in evals/.
dspy = ["dspy>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
legaldoc = "legaldoc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["legaldoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
